[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-kg"
version = "0.1.2"
description = "Sequential Uncertainty Resolution for knowledge-graph construction with small language models."
readme = "readme.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Devansh Vora" }]
keywords = [
    "knowledge-graph",
    "rag",
    "llm",
    "information-extraction",
    "multi-hop",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "crewai[litellm]>=1.0.0,<2",
    "charset-normalizer",
    "tqdm",
    "networkx>=3.0",
]

[project.optional-dependencies]
retrieve = [
    "sentence-transformers>=3.3.0",
    "transformers>=4.44.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "numpy>=1.26",
    "pillow>=10.2.0",
]
eval = ["openai", "python-dotenv", "datasets"]

[project.urls]
Homepage = "https://github.com/Devanshvora03/SAGE-KG"
Repository = "https://github.com/Devanshvora03/SAGE-KG"

[project.scripts]
sage-kg = "sage_kg.cli:main"

[tool.setuptools.packages.find]
include = ["sage_kg*"]
exclude = [
    "sage_kg.evaluation.human_extrinsic*",
    "sage_kg.evaluation.human_intrinsic_semeval*",
]
